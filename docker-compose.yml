services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exapp-frontend
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://localhost:8000}
    restart: unless-stopped
